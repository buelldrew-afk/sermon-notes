<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} · {{church}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="{{bg}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
{{og_image}}
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/notes.css?v={{version}}">
<style>:root{ {{theme}} }</style>
</head>
<body data-page="{{slug}}" data-title="{{title_attr}}" data-passage="{{passage_attr}}" data-date="{{date_long}}">
<header class="hero{{hero_class}}">
  {{hero_img}}
  <div class="brand">
    <img src="../assets/logo.png" alt="Cool Community Church">
    <a href="../">All notes</a>
  </div>
  <div class="wrap">
    {{series_block}}
    <h1 class="title">{{title}}</h1>
    <p class="meta"><span class="ref">{{passage}}</span>{{date_sep}}<span>{{date_long}}</span></p>
  </div>
</header>

<main>
  {{how}}
  {{body}}
</main>

<footer class="site">
  <img src="../assets/logo.png" alt="">
  <div>{{church}} · {{place}}</div>
  <div><a href="../">More sermon notes</a></div>
</footer>

<nav class="toolbar" aria-label="Notes tools">
  {{reveal_button}}
  <button type="button" data-action="size" aria-label="Change text size">
    <svg viewBox="0 0 24 24"><path d="M4 18 9 6l5 12M5.6 14h6.8M15 18l3-7 3 7M15.9 16h4.2"/></svg>Text
  </button>
  <button type="button" data-action="share" aria-label="Share or save my notes">
    <svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Save
  </button>
  <button type="button" data-action="clear" aria-label="Clear my notes">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Clear
  </button>
</nav>

<dialog class="lightbox" aria-label="Photo viewer">
  <div class="lb-stage"><img alt=""></div>
  <div class="lb-count"></div>
  <div class="lb-cap"></div>
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">‹</button>
  <button class="lb-nav lb-next" type="button" aria-label="Next photo">›</button>
</dialog>

<script src="../assets/notes.js?v={{version}}"></script>
</body>
</html>
